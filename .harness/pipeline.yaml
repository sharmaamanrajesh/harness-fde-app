pipeline:
  name: harness-fde-cicd
  identifier: harness_fde_cicd
  projectIdentifier: HarnessCI
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: github
        repoName: harness-fde-app
        build: <+input>
  variables:
    - name: imageRepo
      type: String
      description: Image repository without tag
      required: true
      value: docker.io/sharmaamanrajesh/harness-demo-app
    - name: dockerhubUser
      type: String
      description: Docker Hub account used for push and authenticated pulls
      required: true
      value: sharmaamanrajesh
  stages:
    # ══ 1. CI Stage (Build & Push) ═══════════════════════════════════
    - stage:
        name: CI
        identifier: ci
        type: CI
        tags: {}
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Unit Tests
                  identifier: unit_tests
                  spec:
                    connectorRef: dockerhub
                    image: node:22-alpine
                    shell: Sh
                    command: |-
                      set -eu
                      npm ci
                      npm test
              - step:
                  type: Run
                  name: Build and Push Image
                  identifier: build_push
                  spec:
                    shell: Sh
                    envVariables:
                      DOCKERHUB_USER: <+pipeline.variables.dockerhubUser>
                      DOCKERHUB_TOKEN: <+secrets.getValue("dockerhub_token")>
                      IMAGE: <+pipeline.variables.imageRepo>:<+codebase.commitSha>
                    command: |-
                      set -eu

                      echo "--- toolchain ---"
                      docker buildx version

                      echo "--- registry login ---"
                      echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin

                      echo "--- builder ---"
                      docker buildx create --name ci --driver docker-container --use --bootstrap 2>/dev/null \
                        || docker buildx use ci

                      echo "--- multi-arch build and push ---"
                      docker buildx build \
                        --platform linux/amd64,linux/arm64 \
                        --build-arg COMMIT_SHA=<+codebase.commitSha> \
                        --provenance=mode=max \
                        --sbom=true \
                        -t "$IMAGE" \
                        --push .

                      echo "--- published manifest ---"
                      docker buildx imagetools inspect "$IMAGE"

    # ══ 2. STO Stage (Security Testing) ══════════════════════════════
    - stage:
        name: STO
        identifier: sto
        type: CI
        tags: {}
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: SAST Scan Semgrep
                  identifier: sast_semgrep
                  spec:
                    connectorRef: dockerhub
                    image: semgrep/semgrep:latest
                    shell: Sh
                    command: |-
                      set -eu
                      semgrep scan \
                        --config=p/javascript \
                        --config=p/nodejs \
                        --config=p/owasp-top-ten \
                        --exclude=node_modules \
                        --quiet .
                      echo "SAST scan complete (report-only on this run)"
              - step:
                  type: Run
                  name: Dependency and Secret Scan
                  identifier: fs_scan
                  spec:
                    connectorRef: dockerhub
                    image: aquasec/trivy:latest
                    shell: Sh
                    envVariables:
                      TRIVY_USERNAME: <+pipeline.variables.dockerhubUser>
                      TRIVY_PASSWORD: <+secrets.getValue("dockerhub_token")>
                    command: |-
                      set -eu
                      trivy fs \
                        --scanners vuln,secret,misconfig \
                        --severity HIGH,CRITICAL \
                        --exit-code 0 \
                        --no-progress .
              - step:
                  type: Run
                  name: Container Scan
                  identifier: container_scan
                  spec:
                    connectorRef: dockerhub
                    image: aquasec/trivy:latest
                    shell: Sh
                    envVariables:
                      TRIVY_USERNAME: <+pipeline.variables.dockerhubUser>
                      TRIVY_PASSWORD: <+secrets.getValue("dockerhub_token")>
                      IMAGE: <+pipeline.variables.imageRepo>:<+codebase.commitSha>
                    command: |-
                      set -eu
                      trivy image \
                        --scanners vuln \
                        --severity LOW,MEDIUM,HIGH,CRITICAL \
                        --exit-code 0 \
                        --no-progress "$IMAGE"
              - step:
                  type: Run
                  name: Security Gate - Fail on CRITICAL
                  identifier: security_gate
                  spec:
                    connectorRef: dockerhub
                    image: aquasec/trivy:latest
                    shell: Sh
                    envVariables:
                      TRIVY_USERNAME: <+pipeline.variables.dockerhubUser>
                      TRIVY_PASSWORD: <+secrets.getValue("dockerhub_token")>
                      IMAGE: <+pipeline.variables.imageRepo>:<+codebase.commitSha>
                    command: |-
                      set -eu
                      echo "GATE: pipeline fails if ANY CRITICAL vulnerability is present"
                      trivy image \
                        --scanners vuln \
                        --severity CRITICAL \
                        --exit-code 1 \
                        --no-progress "$IMAGE"
                      echo "PASSED: no CRITICAL vulnerabilities found in $IMAGE"

    # ══ 3. Promote: open a PR against the GitOps repo ════════════════
    - stage:
        name: Promote to Dev
        identifier: promote_dev
        template:
          templateRef: gitops_promotion
          versionLabel: v1
          templateInputs:
            type: CI
            variables:
              - name: targetEnv
                type: String
                value: dev
              - name: autoMerge
                type: String
                value: "true"

    - stage:
        name: CD
        identifier: cd
        type: Deployment
        tags: {}
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        failureStrategies:
          # Timeout must be declared separately: a step that runs out of time
          # expires rather than erroring, and AllErrors does not cover it.
          - onFailure:
              errors:
                - Timeout
              action:
                type: StageRollback
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: harnessdemoapp
          environment:
            environmentRef: dev
            deployToAll: false
            infrastructureDefinitions:
              - identifier: kind_dev
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deployment
                  identifier: rolling_deploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                              - 60s
                            onRetryFailure:
                              action:
                                type: StageRollback
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                              - 60s
                            onRetryFailure:
                              action:
                                type: StageRollback

              - step:
                  type: Http
                  name: Post-Deployment Validation
                  identifier: health_check
                  timeout: 2m
                  spec:
                    url: http://harness-demo-app.dev.svc.cluster.local/health
                    method: GET
                    headers: []
                    outputVariables: []
                    assertion: <+httpResponseCode> == 200 && <+json.select("version", httpResponseBody)> == "<+codebase.commitSha>"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: StageRollback
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: StageRollback
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Deployment
                  identifier: rollback_deploy
                  timeout: 10m
                  spec: {}

    # ══ 5. Promote to Staging ════════════════════════════════════════
    # Same image, no rebuild. Only the GitOps tag pointer moves.
    - stage:
        name: Promote to Staging
        identifier: promote_staging
        template:
          templateRef: gitops_promotion
          versionLabel: v1
          templateInputs:
            type: CI
            variables:
              - name: targetEnv
                type: String
                value: staging
              - name: autoMerge
                type: String
                value: "true"

    - stage:
        name: CD - Staging
        identifier: cd_staging
        type: Deployment
        tags: {}
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        failureStrategies:
          # Timeout must be declared separately: a step that runs out of time
          # expires rather than erroring, and AllErrors does not cover it.
          - onFailure:
              errors:
                - Timeout
              action:
                type: StageRollback
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: harnessdemoapp
          environment:
            environmentRef: staging
            deployToAll: false
            infrastructureDefinitions:
              - identifier: kind_staging
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deployment
                  identifier: rolling_deploy_staging
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                              - 60s
                            onRetryFailure:
                              action:
                                type: StageRollback
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                              - 60s
                            onRetryFailure:
                              action:
                                type: StageRollback
              - step:
                  type: Http
                  name: Post-Deployment Validation
                  identifier: health_check_staging
                  timeout: 2m
                  spec:
                    url: http://harness-demo-app.staging.svc.cluster.local/health
                    method: GET
                    headers: []
                    outputVariables: []
                    assertion: <+httpResponseCode> == 200 && <+json.select("version", httpResponseBody)> == "<+codebase.commitSha>"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: StageRollback
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: StageRollback
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Deployment
                  identifier: rollback_deploy_staging
                  timeout: 10m
                  spec: {}

    # ══ 7. Manual approval gate before production ════════════════════
    - stage:
        name: Approve Production
        identifier: approve_prod
        type: Approval
        tags: {}
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Production Release
                  identifier: approve_prod_step
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Promote harness-demo-app to PRODUCTION?

                      Image: <+pipeline.variables.imageRepo>:<+codebase.commitSha>

                      This artifact passed unit tests, SAST, dependency/secret
                      scanning and the CRITICAL container-scan gate, and is
                      already running in dev and staging. It will not be rebuilt.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []

    # ══ 8. Promote to Prod ═══════════════════════════════════════════
    - stage:
        name: Promote to Prod
        identifier: promote_prod
        template:
          templateRef: gitops_promotion
          versionLabel: v1
          templateInputs:
            type: CI
            variables:
              - name: targetEnv
                type: String
                value: prod
              - name: autoMerge
                type: String
                value: "true"

    - stage:
        name: CD - Prod
        identifier: cd_prod
        type: Deployment
        tags: {}
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        failureStrategies:
          # Timeout must be declared separately: a step that runs out of time
          # expires rather than erroring, and AllErrors does not cover it.
          - onFailure:
              errors:
                - Timeout
              action:
                type: StageRollback
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: harnessdemoapp
          environment:
            environmentRef: prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: kind_prod
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deployment
                  identifier: rolling_deploy_prod
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                              - 60s
                            onRetryFailure:
                              action:
                                type: StageRollback
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                              - 60s
                            onRetryFailure:
                              action:
                                type: StageRollback
              - step:
                  type: Http
                  name: Post-Deployment Validation
                  identifier: health_check_prod
                  timeout: 2m
                  spec:
                    url: http://harness-demo-app.prod.svc.cluster.local/health
                    method: GET
                    headers: []
                    outputVariables: []
                    assertion: <+httpResponseCode> == 200 && <+json.select("version", httpResponseBody)> == "<+codebase.commitSha>"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Timeout
                        action:
                          type: StageRollback
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: StageRollback
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback Deployment
                  identifier: rollback_deploy_prod
                  timeout: 10m
                  spec: {}
  allowStageExecutions: true